name: Publish slot
run-name: "slot: ${{ inputs.category }} (${{ inputs.mode }})"

on:
  # Scheduling lives in Supabase pg_cron (gh-insta-* jobs -> gh_dispatch_repo). GitHub cron proved unreliable.
  workflow_dispatch:
    inputs:
      category:
        description: Content category for this slot
        required: true
        type: choice
        options: [india, india-tech, global, ai, tech, vc, fact, science-or-story, roundup-morning, roundup-evening, story, replenish]
      mode:
        description: publish = live post, handoff = Telegram + shortcut, dry = upload only, render-only = build only
        required: true
        type: choice
        default: publish
        options: [publish, handoff, dry, render-only]

permissions:
  contents: write

concurrency:
  group: insta-slot
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slot (schedule -> pipeline/schedule.json, manual -> inputs)
        id: slot
        env:
          EVT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_CAT: ${{ inputs.category }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVT" = "workflow_dispatch" ]; then
            echo "category=$IN_CAT" >> "$GITHUB_OUTPUT"
            echo "mode=$IN_MODE" >> "$GITHUB_OUTPUT"
            echo "manual: $IN_CAT ($IN_MODE)"
          else
            node -e '
              const s = require("./pipeline/schedule.json")[process.env.CRON];
              if (!s) { console.error("no slot configured for cron: " + process.env.CRON); process.exit(1); }
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `category=${s.category}\nmode=${s.mode}\n`);
              console.log(`scheduled slot ${s.ist} IST -> ${s.category} (${s.mode})`);
            '
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            renderer/package-lock.json

      - name: Install deps (system Chrome, no bundled Chromium)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm ci --prefix pipeline
          npm ci --prefix renderer

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Random delay (crons fire 10 min early; wait 0-20 min so each day lands at a different minute, before or after the nominal time)
        if: inputs.mode == 'handoff' || inputs.mode == 'publish'
        run: |
          d=$(( (RANDOM * 32768 + RANDOM) % 1200 ))
          echo "waiting ${d}s"
          sleep $d

      - name: Preflight (every path checked before anything runs for real)
        working-directory: pipeline
        run: node preflight.mjs

      - name: Run slot
        id: run
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: me
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: insta-slides
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        working-directory: pipeline
        run: node run-slot.mjs "${{ steps.slot.outputs.category }}" --${{ steps.slot.outputs.mode }}

      - name: Retry once (a flaky feed, photo or model call should not cost the slot)
        id: retry
        if: steps.run.outcome == 'failure'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: me
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: insta-slides
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        working-directory: pipeline
        run: |
          echo "first attempt failed, retrying in 60s"
          sleep 60
          node run-slot.mjs "${{ steps.slot.outputs.category }}" --${{ steps.slot.outputs.mode }}

      - name: Alert Yash on Telegram if the slot still failed
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TG/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="⚠️ Wortins post FAILED: ${{ steps.slot.outputs.category }} slot (tried twice). No post for this slot. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

      - name: Persist state (seen/published/used/bank), union-merging if another run landed first
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/state pipeline/stories-bank.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: ${{ steps.slot.outputs.category }} slot ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4; do
            git fetch -q origin main
            if GIT_EDITOR=true git rebase origin/main || (node pipeline/merge-state.mjs && GIT_EDITOR=true git rebase --continue); then
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not persist state after 4 attempts" && exit 1