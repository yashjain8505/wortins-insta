name: Publish slot
run-name: "slot: ${{ inputs.category || format('cron {0}', github.event.schedule) }}"

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST india (handoff)
    - cron: "30 4 * * *"   # 10:00 IST india-tech
    - cron: "30 6 * * *"   # 12:00 IST ai
    - cron: "30 8 * * *"   # 14:00 IST fact (handoff)
    - cron: "30 10 * * *"  # 16:00 IST global
    - cron: "30 12 * * *"  # 18:00 IST vc
    - cron: "30 14 * * *"  # 20:00 IST tech (handoff)
    - cron: "30 16 * * *"  # 22:00 IST science-or-story
  workflow_dispatch:
    inputs:
      category:
        description: Content category for this slot
        required: true
        type: choice
        options: [india, india-tech, global, ai, tech, vc, fact, science-or-story]
      mode:
        description: publish = live post, handoff = Telegram + shortcut, dry = upload only, render-only = build only
        required: true
        type: choice
        default: publish
        options: [publish, handoff, dry, render-only]

permissions:
  contents: write

concurrency:
  group: insta-slot
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve slot (schedule -> pipeline/schedule.json, manual -> inputs)
        id: slot
        env:
          EVT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_CAT: ${{ inputs.category }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVT" = "workflow_dispatch" ]; then
            echo "category=$IN_CAT" >> "$GITHUB_OUTPUT"
            echo "mode=$IN_MODE" >> "$GITHUB_OUTPUT"
            echo "manual: $IN_CAT ($IN_MODE)"
          else
            node -e '
              const s = require("./pipeline/schedule.json")[process.env.CRON];
              if (!s) { console.error("no slot configured for cron: " + process.env.CRON); process.exit(1); }
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `category=${s.category}\nmode=${s.mode}\n`);
              console.log(`scheduled slot ${s.ist} IST -> ${s.category} (${s.mode})`);
            '
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            renderer/package-lock.json

      - name: Install deps (system Chrome, no bundled Chromium)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm ci --prefix pipeline
          npm ci --prefix renderer

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run slot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: me
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: insta-slides
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        working-directory: pipeline
        run: node run-slot.mjs "${{ steps.slot.outputs.category }}" --${{ steps.slot.outputs.mode }}

      - name: Persist state (seen/published/facts-used)
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/state
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash origin main
            git commit -m "state: ${{ steps.slot.outputs.category }} slot ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
