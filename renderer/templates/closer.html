<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide { width: 1080px; height: 1350px; background: #9C2B1D; color: #F3ECDA; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 64px; font-family: 'Space Grotesk', Arial, sans-serif; overflow: hidden; }
  .top { display: flex; justify-content: flex-start; align-items: center; }
  .logo { height: 46px; }
  .mid { display: flex; flex-direction: column; gap: 48px; align-items: flex-start; }
  .tag { background: #F3ECDA; color: #9C2B1D; font-weight: 700; font-size: 26px; letter-spacing: 2px; padding: 14px 24px; text-transform: uppercase; transform: rotate(-3deg); }
  .headline { font-weight: 700; font-size: 84px; line-height: 1.2; }
  .hl { background: #F3ECDA; color: #9C2B1D; padding: 2px 16px; white-space: nowrap; }
  .chip { background: #F3ECDA; border: 4px solid #1B1712; box-shadow: 12px 12px 0 #1B1712; color: #1B1712; font-weight: 700; font-size: 40px; padding: 24px 40px; }
  .bottom { display: flex; justify-content: space-between; align-items: center; }
  .muted { font-size: 24px; font-weight: 500; color: rgba(243,236,218,0.68); }
</style>
</head>
<body>
<div class="slide">
  <div class="top"><img class="logo" src="{{LOGO_CREAM}}"></div>
  <div class="mid">
    <div class="tag">That's the story</div>
    <div class="headline">New here? We drop <span class="hl">2-3 of these</span> every day.</div>
    <div class="chip">Follow {{HANDLE}}</div>
  </div>
  <div class="bottom">
    <div class="muted">save it · share it · send it to a friend</div>
    <div class="muted">wortins.com</div>
  </div>
</div>
</body>
</html>
