<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide { width: 1080px; height: 1350px; background-color: #1B1712; background-image: linear-gradient(180deg, rgba(27,23,18,0.15) 0%, rgba(27,23,18,0.32) 38%, rgba(27,23,18,0.90) 72%, rgba(27,23,18,0.98) 100%), url("{{PHOTO}}"); background-size: cover; background-position: center 30%; color: #F3ECDA; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 64px; font-family: 'Space Grotesk', Arial, sans-serif; overflow: hidden; }
  .top { display: flex; justify-content: flex-start; align-items: center; }
  .logo { height: 46px; }
  .block { display: flex; flex-direction: column; gap: 30px; align-items: flex-start; }
  .meta { display: flex; align-items: center; gap: 22px; }
  .tag { background: #9C2B1D; color: #F3ECDA; font-weight: 700; font-size: 24px; letter-spacing: 2px; padding: 12px 20px; text-transform: uppercase; }
  .kicker { font-size: 23px; font-weight: 600; letter-spacing: 4px; color: rgba(243,236,218,0.85); text-transform: uppercase; }
  .headline { font-weight: 700; font-size: 82px; line-height: 1.18; }
  .hl { background: #9C2B1D; color: #F3ECDA; padding: 2px 16px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .muted { font-size: 24px; font-weight: 500; color: rgba(243,236,218,0.68); }
  .credit { font-size: 17px; font-weight: 400; color: rgba(243,236,218,0.42); }
  .swipe { display: flex; align-items: center; gap: 20px; }
  .arrow { width: 72px; height: 72px; background: #F3ECDA; color: #9C2B1D; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; }
</style>
</head>
<body>
<div class="slide">
  <div class="top"><img class="logo" src="{{LOGO_CREAM}}"></div>
  <div class="block">
    <div class="meta"><div class="tag">{{TAG}}</div><div class="kicker">{{KICKER}}</div></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="bottom">
      <div class="stack">
        <div class="muted">{{HANDLE}}</div>
        <div class="credit">{{CREDIT}}</div>
      </div>
      <div class="swipe"><div class="muted">swipe</div><div class="arrow">→</div></div>
    </div>
  </div>
</div>
</body>
</html>
