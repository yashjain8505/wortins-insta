<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide { width: 1080px; height: 1350px; background: #F3ECDA; color: #1B1712; display: flex; flex-direction: column; font-family: 'Space Grotesk', Arial, sans-serif; overflow: hidden; }
  .photo { height: 580px; flex-shrink: 0; background-color: #1B1712; background-image: url("{{PHOTO}}"); background-size: cover; background-position: {{PHOTO_POS}}; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 64px 24px 64px; }
  .logo { height: 42px; align-self: flex-start; }
  .credit { align-self: flex-end; font-size: 16px; color: rgba(243,236,218,0.85); background: rgba(27,23,18,0.55); padding: 6px 10px; }
  .panel { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 48px 64px 56px 64px; }
  .content { display: flex; flex-direction: column; gap: 26px; align-items: flex-start; }
  .label { background: #9C2B1D; color: #F3ECDA; font-weight: 700; font-size: 22px; letter-spacing: 3px; padding: 10px 18px; text-transform: uppercase; }
  .heading { font-weight: 700; font-size: 54px; line-height: 1.14; color: #1B1712; }
  .heading .hl { background: #9C2B1D; color: #F3ECDA; padding: 0 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .body { font-size: 28px; line-height: 1.55; color: #514A40; max-width: 920px; }
  .bottom { display: flex; justify-content: space-between; align-items: center; }
  .dots { display: flex; gap: 14px; align-items: center; }
  .dot { width: 16px; height: 16px; background: rgba(27,23,18,0.15); }
  .dot.on { background: #9C2B1D; }
  .muted { font-size: 22px; font-weight: 500; color: #8A8171; }
</style>
</head>
<body>
<div class="slide">
  <div class="photo">
    <img class="logo" src="{{LOGO_CREAM}}">
    <div class="credit">{{CREDIT}}</div>
  </div>
  <div class="panel">
    <div class="content">
      <div class="label">{{LABEL}}</div>
      <div class="heading">{{HEADING}}</div>
      <div class="body">{{BODY}}</div>
    </div>
    <div class="bottom">
      <div class="dots">{{DOTS}}</div>
      <div class="muted">{{SOURCE}}</div>
    </div>
  </div>
</div>
</body>
</html>
