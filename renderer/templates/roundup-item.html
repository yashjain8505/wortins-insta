<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide { width: 1080px; height: 1350px; background-color: #1B1712; background-image: linear-gradient(180deg, rgba(27,23,18,0.15) 0%, rgba(27,23,18,0.30) 40%, rgba(27,23,18,0.92) 70%, rgba(27,23,18,0.98) 100%), url("{{PHOTO}}"); background-size: cover; background-position: center 30%; color: #F3ECDA; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 64px; font-family: 'Space Grotesk', Arial, sans-serif; overflow: hidden; }
  .top { display: flex; justify-content: flex-start; align-items: center; }
  .logo { height: 46px; }
  .block { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
  .meta { display: flex; align-items: center; gap: 18px; }
  .num { background: #F3ECDA; color: #9C2B1D; font-weight: 700; font-size: 30px; padding: 10px 18px; }
  .tag { background: #9C2B1D; color: #F3ECDA; font-weight: 700; font-size: 24px; letter-spacing: 2px; padding: 12px 20px; text-transform: uppercase; }
  .headline { font-weight: 700; font-size: 76px; line-height: 1.16; }
  .line { font-size: 32px; line-height: 1.5; color: rgba(243,236,218,0.8); max-width: 900px; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .muted { font-size: 22px; font-weight: 500; color: rgba(243,236,218,0.68); }
  .credit { font-size: 17px; color: rgba(243,236,218,0.42); }
  .dots { display: flex; gap: 12px; align-items: center; }
  .dot { width: 14px; height: 14px; background: rgba(243,236,218,0.3); }
  .dot.on { background: #F3ECDA; }
</style>
</head>
<body>
<div class="slide">
  <div class="top"><img class="logo" src="{{LOGO_CREAM}}"></div>
  <div class="block">
    <div class="meta"><div class="num">{{NUM}}</div><div class="tag">{{TAG}}</div></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="line">{{LINE}}</div>
    <div class="bottom">
      <div class="stack"><div class="muted">source: {{SOURCE}}</div><div class="credit">{{CREDIT}}</div></div>
      <div class="dots">{{DOTS}}</div>
    </div>
  </div>
</div>
</body>
</html>
