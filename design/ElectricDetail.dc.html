<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #1D2BE0; }
    a { color: #D8FF3B; } a:hover { color: #B9E02C; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #1D2BE0; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 64px; font-family: 'Space Grotesk', Arial, sans-serif; overflow: hidden;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-weight: 700; font-size: 26px; letter-spacing: 5px;">BRIEF<span style="color: #D8FF3B;">.</span></div>
    <div style="font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.65);">03 / 06</div>
  </div>
  <div style="background: #FFFFFF; border: 4px solid #101223; box-shadow: 16px 16px 0 #101223; padding: 64px; display: flex; flex-direction: column; gap: 36px;">
    <div style="align-self: flex-start; background: #D8FF3B; color: #101223; font-weight: 700; font-size: 22px; letter-spacing: 3px; padding: 10px 16px; text-transform: uppercase;">The weird part</div>
    <div style="color: #101223; font-weight: 700; font-size: 58px; line-height: 1.16;">The main heart shuts off mid-swim — so octopuses prefer to crawl.</div>
    <div style="color: #454965; font-size: 27px; line-height: 1.55;">Two hearts pump blood to the gills. The third serves the body — and it pauses under the strain of swimming. Crawling simply costs less energy.</div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; gap: 14px; align-items: center;">
      <div style="width: 16px; height: 16px; background: rgba(255,255,255,0.3);"></div>
      <div style="width: 16px; height: 16px; background: rgba(255,255,255,0.3);"></div>
      <div style="width: 16px; height: 16px; background: #D8FF3B;"></div>
      <div style="width: 16px; height: 16px; background: rgba(255,255,255,0.3);"></div>
      <div style="width: 16px; height: 16px; background: rgba(255,255,255,0.3);"></div>
      <div style="width: 16px; height: 16px; background: rgba(255,255,255,0.3);"></div>
    </div>
    <div style="font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.65);">source: Smithsonian Ocean</div>
  </div>
</div>
</x-dc>
